name: repro

on:
  push:
  workflow_dispatch:

jobs:
  hammer:
    name: shard ${{ matrix.shard }} (cpus ${{ matrix.cpus }}, pool ${{ matrix.pool_max || 'default' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Shards 1-5 run on two cores (the shape the crash was observed on); shards 6-10 run on a
      # SINGLE core, which maximises preemption inside EndpointHtmlRenderer's synchronous walk.
      # Shards 1-5: two cores, default thread pool, high volume.
      # Shards 6-10: ONE core AND a force-capped thread pool, so the CPU-bound pool work every
      # component now awaits has to queue. Volume is lower there because that configuration runs
      # roughly 10x slower - the point of those shards is contention, not throughput.
      matrix:
        include:
          - { shard: 1, cpus: "0,1", iterations: "5000", pool_min: "", pool_max: "" }
          - { shard: 2, cpus: "0,1", iterations: "5000", pool_min: "", pool_max: "" }
          - { shard: 3, cpus: "0,1", iterations: "5000", pool_min: "", pool_max: "" }
          - { shard: 4, cpus: "0,1", iterations: "5000", pool_min: "", pool_max: "" }
          - { shard: 5, cpus: "0,1", iterations: "5000", pool_min: "", pool_max: "" }
          - { shard: 6, cpus: "0", iterations: "300", pool_min: "1", pool_max: "8" }
          - { shard: 7, cpus: "0", iterations: "300", pool_min: "1", pool_max: "8" }
          - { shard: 8, cpus: "0", iterations: "300", pool_min: "1", pool_max: "8" }
          - { shard: 9, cpus: "0", iterations: "300", pool_min: "1", pool_max: "8" }
          - { shard: 10, cpus: "0", iterations: "300", pool_min: "1", pool_max: "8" }
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      REPRO_ROUNDS: "10"
      REPRO_ITERATIONS: ${{ matrix.iterations }}
      REPRO_PARALLELISM: "16"
      REPRO_CPUS: ${{ matrix.cpus }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show the machine (the bug only ever appears on 2-core runners)
        run: |
          nproc
          dotnet --info | head -20

      - name: Install dotnet-dump
        run: |
          dotnet tool install --global dotnet-dump
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run the repro
        id: repro
        shell: bash
        env:
          POOL_MIN: ${{ matrix.pool_min }}
          POOL_MAX: ${{ matrix.pool_max }}
        run: |
          set +e
          # Only the starved shards get the knobs at all, so an unset variable on shards 1-5 is
          # genuinely unset rather than an empty string the runtime might misparse.
          if [ -n "${POOL_MIN:-}" ]; then export DOTNET_ThreadPool_ForceMinWorkerThreads="$POOL_MIN"; fi
          if [ -n "${POOL_MAX:-}" ]; then export DOTNET_ThreadPool_ForceMaxWorkerThreads="$POOL_MAX"; fi
          echo "== DOTNET_ThreadPool_ForceMinWorkerThreads=${DOTNET_ThreadPool_ForceMinWorkerThreads:-(unset)}"
          echo "== DOTNET_ThreadPool_ForceMaxWorkerThreads=${DOTNET_ThreadPool_ForceMaxWorkerThreads:-(unset)}"
          ./repro.sh
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 134 ]; then
            echo "reproduced=true" >> "$GITHUB_OUTPUT"
          else
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Analyse the dump
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          dumps=(/tmp/repro-*.dmp)
          if [ ${#dumps[@]} -eq 0 ]; then
            echo "No dump on this shard."
            exit 0
          fi
          for d in "${dumps[@]}"; do
            echo "===================== $d ====================="
            dotnet-dump analyze "$d" \
              -c clrstack \
              -c "dumpheap -type SectionOutletContentRenderer" \
              -c exit || true
          done

      - name: Upload dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-dumps-shard-${{ matrix.shard }}
          path: /tmp/repro-*.dmp
          if-no-files-found: ignore
          retention-days: 14

      - name: Step summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.repro.outputs.reproduced }}" = "true" ]; then
            echo "### shard ${{ matrix.shard }}: REPRODUCED (exit 134) :boom:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### shard ${{ matrix.shard }}: not reproduced (exit ${{ steps.repro.outputs.exit_code }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "rounds=\`$REPRO_ROUNDS\` iterations=\`$REPRO_ITERATIONS\` parallelism=\`$REPRO_PARALLELISM\` taskset=\`$REPRO_CPUS\` runner_cores=\`$(nproc)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "thread pool: min=\`${{ matrix.pool_min }}\` max=\`${{ matrix.pool_max }}\` (blank = runtime default)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "requests per round: \`$((REPRO_ITERATIONS * 6))\` across 6 routes" >> "$GITHUB_STEP_SUMMARY"

      # Fail the job when it reproduced, so a hit is visible straight from the run list.
      - name: Fail the shard when reproduced
        if: steps.repro.outputs.reproduced == 'true'
        run: |
          echo "::error::Reproduced dotnet/aspnetcore#69035 — the round exited 134 (SIGABRT / stack overflow)"
          exit 1
